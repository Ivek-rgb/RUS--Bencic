; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ----- Shared base configuration ------------------------------------------
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ----- Default Wokwi-demo build (src/main1.cpp, Light Sleep) --------------
; Active sketch is src/main1.cpp: ESP32 Light Sleep with a 3-second cycle.
; Light Sleep preserves SRAM and does not reset the chip on wake, which
; produces a clean serial trace in Wokwi (one banner, then [READ]/[SLEEP]/
; [WAKE] forever). The real-hardware Deep Sleep reference lives in
; src/archive/main2.cpp and is excluded from this build.
[env:esp32doit-devkit-v1]
build_src_filter = +<*> -<archive/>

; ----- Real-hardware build (src/archive/main2.cpp, Deep Sleep) ------------
; Build this with: pio run -e esp32-realhw
; Excludes src/main1.cpp and includes only the Deep Sleep variant. The
; firmware would target real silicon: 60-second wakes, RTC_DATA_ATTR ring
; buffer, full chip reset between cycles. Under Wokwi this builds and runs
; but the boot banner reprints every interval (correct Deep Sleep behaviour,
; visually noisy) and Wokwi's watchdog quirks can fire during the sleep
; window - which is why src/main1.cpp exists as the demo variant.
[env:esp32-realhw]
build_src_filter = -<*> +<archive/main2.cpp>
