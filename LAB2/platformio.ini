; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ----- Shared base configuration ------------------------------------------
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ----- Default Wokwi-friendly build (src/main.cpp) ------------------------
; Active sketch is src/main.cpp (delay-based emulated sleep). The hardware
; Deep Sleep variant lives in src/archive/main1.cpp and is excluded here.
[env:esp32doit-devkit-v1]
build_src_filter = +<*> -<archive/>

; ----- Real-hardware build (src/archive/main1.cpp) ------------------------
; Build this with: pio run -e esp32-realhw
; Excludes src/main.cpp and includes only the Deep Sleep variant. The
; firmware would target real silicon; under Wokwi the Deep Sleep wake
; would re-run setup() every interval and reprint the banner, which is
; correct behaviour but visually noisy.
[env:esp32-realhw]
build_src_filter = -<*> +<archive/main1.cpp>
