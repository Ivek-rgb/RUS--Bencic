# .github/workflows/cppcheck.yml

# Name of the workflow
name: Cppcheck Static Analysis

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [ main ]
  # Triggers the workflow on pull request events but only for the main branch
  pull_request:
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "cppcheck"
  cppcheck:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install cppcheck using the package manager
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # Run cppcheck over every LAB directory present in the repo, so adding
      # a new lab (LAB3, ...) only requires creating the folder.
      - name: Run cppcheck analysis
        run: |
          : > cppcheck-report.txt
          shopt -s nullglob
          found_any=0
          for lab in LAB1 LAB2; do
            if [ -d "$lab" ]; then
              found_any=1
              sources=$(find "$lab" -name '*.cpp')
              if [ -z "$sources" ]; then
                echo "=== $lab: no .cpp sources, skipping ===" >> cppcheck-report.txt
                continue
              fi
              echo "=== cppcheck $lab ===" >> cppcheck-report.txt
              cppcheck --enable=all --inconclusive --std=c++17 --verbose \
                       $sources >> cppcheck-report.txt 2>&1 || true
              echo >> cppcheck-report.txt
            fi
          done
          if [ "$found_any" = "0" ]; then
            echo "No LAB directories found"
            exit 1
          fi
          echo "--- Cppcheck Report ---"
          cat cppcheck-report.txt
          echo "--- End Report ---"

      # Upload cppcheck report as artifact
      - name: Upload cppcheck report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.txt