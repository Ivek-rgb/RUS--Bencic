name: Doxygen Documentation

on:
  push:
    branches:
      - main  # Trigger workflow on push to the 'main' branch
  pull_request:
    branches:
      - main  # Trigger workflow for pull requests targeting the 'main' branch

permissions:
  contents: write  # Allow GitHub Actions to push changes to the 'gh-pages' branch

jobs:
  doxygen:
    name: Generate Doxygen Documentation
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Checkout the code from the repository

      - name: Cache Doxygen
        uses: actions/cache@v3  # Cache Doxygen installation to speed up subsequent builds
        with:
          path: ~/.cache/doxygen  # Cache location
          key: doxygen-${{ runner.os }}  # Cache key based on OS

      - name: Install Doxygen
        run: |
          sudo apt-get update  # Update package list
          sudo apt-get install -y doxygen  # Install Doxygen
          doxygen -v  # Verify that Doxygen is installed correctly

      - name: Install Graphviz and PlantUML
        run: sudo apt-get install -y graphviz plantuml

      - name: Generate LAB1 documentation
        run: |
          cd LAB1
          doxygen Doxyfile || { echo "LAB1 Doxygen failed"; exit 1; }
          if [ ! -d "docs/html" ]; then echo "Error: LAB1/docs/html not found"; exit 1; fi

      - name: Generate LAB2 documentation
        run: |
          cd LAB2
          doxygen Doxyfile || { echo "LAB2 Doxygen failed"; exit 1; }
          if [ ! -d "docs/html" ]; then echo "Error: LAB2/docs/html not found"; exit 1; fi

      - name: Assemble combined gh-pages site
        run: |
          # The published site has the structure
          #   /            -> landing page with links to both labs
          #   /lab1/       -> LAB1 Doxygen output
          #   /lab2/       -> LAB2 Doxygen output
          mkdir -p site/lab1 site/lab2
          cp -r LAB1/docs/html/. site/lab1/
          cp -r LAB2/docs/html/. site/lab2/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>RUS - Razvoj ugradbenih sustava</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 720px;
                     margin: 4rem auto; padding: 0 1.5rem; line-height: 1.5;
                     color: #222; }
              h1 { margin-bottom: 0.25rem; }
              .sub { color: #666; margin-top: 0; }
              ul { list-style: none; padding: 0; }
              li { margin: 1.25rem 0; }
              a { font-size: 1.15rem; }
              .desc { color: #444; font-size: 0.95rem; margin-top: 0.25rem; }
              footer { color: #888; font-size: 0.85rem; margin-top: 3rem; }
            </style>
          </head>
          <body>
            <h1>RUS &mdash; Razvoj ugradbenih sustava</h1>
            <p class="sub">Course lab documentation (TVZ, Ivan Bencic)</p>
            <ul>
              <li>
                <a href="lab1/">Lab 1 &mdash; Interrupts in Embedded Systems</a>
                <div class="desc">Multi-interrupt traffic-light intersection on ESP32 (timer, button, ultrasonic sensor) with priority handling.</div>
              </li>
              <li>
                <a href="lab2/">Lab 2 &mdash; Power Management with Sleep Modes</a>
                <div class="desc">Periodic-wake environment datalogger with DHT22 demonstrating Deep Sleep and RTC-memory persistence on ESP32.</div>
              </li>
            </ul>
            <footer>Generated by Doxygen + PlantUML via GitHub Actions.</footer>
          </body>
          </html>
          HTML

      - name: Deploy Documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site